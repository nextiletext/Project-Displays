<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website Projects</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            color: #f0f6fc;
            margin-bottom: 32px;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        .subtext {
            display: block;
            font-size: 0.75rem;
            font-weight: 400;
            color: #8b949e;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Some of my websites</h1>

        <a href="https://nextiletext.github.io/NextOS/" target="_blank" class="btn">
            NextOS
            <span class="subtext">(Desktop Recommended)</span>
        </a>

        <a href="https://nextiletext.github.io/Dino-Tracker/" target="_blank" class="btn">
            Dino Tracker
        </a>

        <a href="https://nextiletext.github.io/Number-Guessing-Game" target="_blank" class="btn">
            Number Guessing Game
        </a>

        <a href="https://nextiletext.github.io/jurassic-park-website/" target="_blank" class="btn">
            Jurassic World
        </a>

        <a href="https://nextiletext.github.io/Weather-app3/" target="_blank" class="btn">
            Weather App
        </a>

        <a href="https://nextiletext.github.io/ninjago-info/" target="_blank" class="btn">
            Ninjago
        </a>
    </div>

</body>
</html>
